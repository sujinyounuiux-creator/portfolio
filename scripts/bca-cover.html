<!doctype html>
<!-- BCA cover (1600 x 900), screenshotted by scripts/build-bca-cover.mjs. Images are relative to the project root. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    font-family: Inter, sans-serif;
    color: #fff;
    background:
      radial-gradient(900px 600px at 78% 30%, rgba(197, 255, 75, 0.16), transparent 60%),
      radial-gradient(700px 500px at 10% 100%, rgba(0, 102, 78, 0.9), transparent 70%),
      #004131;
    position: relative;
  }
  .brand { position: absolute; left: 96px; top: 84px; display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; }
  .brand p { font-size: 17px; line-height: 1.3; font-weight: 500; color: rgba(255,255,255,.85); }
  .text { position: absolute; left: 96px; top: 270px; width: 640px; }
  .kicker { font-size: 16px; font-weight: 600; letter-spacing: .16em; color: #C5FF4B; margin-bottom: 22px; }
  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: #C5FF4B; }
  .lede { margin-top: 28px; font-size: 21px; line-height: 1.55; color: rgba(255,255,255,.82); width: 560px; }
  .chips { margin-top: 36px; display: flex; gap: 12px; }
  .chips span { font-size: 15px; font-weight: 500; padding: 9px 16px; border-radius: 999px; border: 1px solid rgba(197,255,75,.45); color: #E9FFC2; }
  .browser { position: absolute; left: 790px; top: 150px; width: 720px; border-radius: 14px; overflow: hidden; background: #fff; box-shadow: 0 40px 80px rgba(0,0,0,.45); }
  .browser .bar { height: 30px; background: #E8EEE5; display: flex; align-items: center; gap: 7px; padding-left: 14px; }
  .browser .bar i { width: 10px; height: 10px; border-radius: 50%; background: #c9d3c5; }
  .browser .shot { height: 560px; background: url('../public/images/projects/bca-web-home.webp') top / 100% auto no-repeat; }
  .phone { position: absolute; width: 270px; clip-path: inset(2px round 44px); filter: drop-shadow(0 30px 50px rgba(0,0,0,.5)); }
  .p1 { left: 1280px; top: 300px; }
</style>
</head>
<body>
  <div class="brand"><img src="../design-exports/logos/bca.png" alt="" /><p>Brazilian Community<br />Association of BC</p></div>
  <div class="text">
    <p class="kicker">WEBSITE REDESIGN · NON-PROFIT</p>
    <h1>Brazilian roots,<br />at <em>home</em> in BC</h1>
    <p class="lede">A clearer, bilingual website that helps Brazilians in BC find events, local businesses and ways to get involved.</p>
    <div class="chips"><span>Events calendar</span><span>Business directory</span><span>EN / PT</span></div>
  </div>
  <div class="browser"><div class="bar"><i></i><i></i><i></i></div><div class="shot"></div></div>
  <img class="phone p1" src="../design-exports/bca/m-events.png" alt="" />
</body>
</html>
